<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новогодний шар желаний | МИР ЭНЕРГИЯ</title>

    <!-- Новогодние шрифты из Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Cormorant+Garamond:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body {
            background: radial-gradient(ellipse at 50% 20%, #1c2a55 0%, #0e1733 45%, #050810 100%);
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            color: white;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 15%, rgba(150, 180, 255, 0.12), transparent 40%),
                radial-gradient(circle at 80% 25%, rgba(255, 200, 120, 0.08), transparent 45%),
                radial-gradient(circle at 50% 100%, rgba(180, 220, 255, 0.15), transparent 55%);
            pointer-events: none;
            z-index: 0;
            animation: glowPulse 9s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.75; }
            50%      { opacity: 1; }
        }

        /* ======== ЗВЁЗДЫ ======== */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle ease-in-out infinite;
            will-change: opacity, transform;
        }

        .star.big {
            box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.9),
                        0 0 20px 6px rgba(200, 220, 255, 0.4);
        }

        .star.bright {
            box-shadow: 0 0 12px 3px rgba(255, 248, 220, 1),
                        0 0 30px 10px rgba(255, 220, 150, 0.6);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.25; transform: scale(0.8); }
            50%      { opacity: 1;    transform: scale(1.15); }
        }

        .star-cross {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 20px 4px rgba(255, 240, 200, 0.9);
            animation: crossPulse 4s ease-in-out infinite;
        }
        .star-cross::before,
        .star-cross::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.9), transparent);
            transform: translate(-50%, -50%);
        }
        .star-cross::before { width: 60px; height: 1px; }
        .star-cross::after  { width: 1px; height: 60px;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.9), transparent); }

        @keyframes crossPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50%      { opacity: 1;   transform: scale(1.3); }
        }

        /* ======== СНЕГ ======== */
        .snow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 4;
            overflow: hidden;
        }

        .snowflake {
            position: absolute;
            top: -30px;
            background: white;
            border-radius: 50%;
            animation: fall linear infinite;
            will-change: transform;
        }

        .snowflake.tiny { filter: blur(1.2px); opacity: 0.55; }
        .snowflake.big  { box-shadow: 0 0 6px rgba(255, 255, 255, 0.9); }
        .snowflake.huge { box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8); }

        @keyframes fall {
            0%   { transform: translate3d(0, 0, 0) rotate(0deg); }
            100% { transform: translate3d(var(--drift, 40px), 110vh, 0) rotate(360deg); }
        }

        /* ======== КОНТЕЙНЕР ======== */
        .container {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 20px 60px;
            text-align: center;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            gap: 8px;
        }

        /* Заголовок — в одну строку, без подсветки */
        .title {
            font-family: 'Great Vibes', 'Marck Script', cursive;
            font-size: clamp(1.4rem, 3.2vw, 2.4rem);
            line-height: 1.15;
            margin: 0;
            color: #f3e5ab;
            text-shadow: none;
            letter-spacing: 1px;
            white-space: nowrap;
            position: relative;
            z-index: 8;
        }

        /* ======== ШАР — НА ПЕРЕДНЕМ ПЛАНЕ, ОПУЩЕН НИЖЕ ======== */
        .globe-container {
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin: 0 0 -60px 0;     /* было -20px — шар опущен ниже, ближе к сугробу */
            z-index: 6;               /* выше сугробов и снега — шар на переднем плане */
            transition: filter 0.3s ease;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.5))
                    drop-shadow(0 0 30px rgba(212, 175, 55, 0.25));
        }

        .globe-container:hover {
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.5))
                    drop-shadow(0 0 50px rgba(255, 220, 150, 0.6));
        }

        /* Картинка шара — без маски, видна целиком */
        .globe-img {
            max-width: 100%;
            height: auto;
            max-height: 62vh;
            user-select: none;
            -webkit-user-drag: none;
            transform-origin: 50% 90%;
            animation: globeAlive 7s ease-in-out infinite;
            transition: filter 0.3s ease;
        }

        @keyframes globeAlive {
            0%   { transform: rotate(-1.2deg)  scale(1); }
            25%  { transform: rotate(0.8deg)   scale(1.015); }
            50%  { transform: rotate(1.4deg)   scale(1); }
            75%  { transform: rotate(-0.6deg)  scale(1.01); }
            100% { transform: rotate(-1.2deg)  scale(1); }
        }

        .globe-container:hover .globe-img {
            animation: globeAliveHover 3s ease-in-out infinite;
        }

        @keyframes globeAliveHover {
            0%, 100% { transform: rotate(-2deg) scale(1.03); }
            50%      { transform: rotate(2deg)  scale(1.045); }
        }

        .shake .globe-img {
            animation: shake 0.6s cubic-bezier(.36,.07,.19,.97) both !important;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0) rotate(-2deg); }
            20%, 80% { transform: translate3d(5px, 0, 0) rotate(2.5deg); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0) rotate(-3deg); }
            40%, 60% { transform: translate3d(8px, 0, 0) rotate(3deg); }
        }

        /* ======== ЗАДНИЕ СУГРОБЫ ======== */
        .snowdrifts {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 260px;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }

        .snowdrift {
            position: absolute;
            bottom: 0;
            left: -10%;
            width: 120%;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        }

        .snowdrift.back {
            height: 200px;
            background: radial-gradient(ellipse at 30% 100%, #e8f0ff 0%, #c9d8f0 40%, #a9bde0 80%, #8fa5cf 100%);
            box-shadow: 0 -10px 40px rgba(200, 220, 255, 0.5);
            animation: driftShift 12s ease-in-out infinite;
        }

        .snowdrift.middle {
            height: 170px;
            background: radial-gradient(ellipse at 80% 100%, #ffffff 0%, #e3edfc 50%, #c2d3ef 100%);
            opacity: 0.95;
            animation: driftShift 14s ease-in-out infinite;
        }

        @keyframes driftShift {
            0%, 100% { transform: translateX(0) translateY(0); }
            50%      { transform: translateX(-15px) translateY(-3px); }
        }

        .snowdrifts::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 15% 90%, rgba(255,255,255,0.8) 0%, transparent 3%),
                radial-gradient(circle at 35% 80%, rgba(255,255,255,0.6) 0%, transparent 2%),
                radial-gradient(circle at 55% 88%, rgba(255,255,255,0.9) 0%, transparent 2.5%),
                radial-gradient(circle at 72% 82%, rgba(255,255,255,0.7) 0%, transparent 2%),
                radial-gradient(circle at 88% 92%, rgba(255,255,255,0.8) 0%, transparent 3%);
            animation: sparkleSnow 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes sparkleSnow {
            0%, 100% { opacity: 0.5; }
            50%      { opacity: 1; }
        }

        /* ======== ПЕРЕДНИЙ СУГРОБ — ПОД ШАРОМ ======== */
        .snowdrift-front {
            position: fixed;
            bottom: 0;
            left: -10%;
            width: 120%;
            height: 150px;
            pointer-events: none;
            z-index: 2;   /* ниже шара (6) — шар на переднем плане */
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            background: radial-gradient(ellipse at 60% 100%, #ffffff 0%, #f0f6ff 40%, #d8e6fb 80%, #b9cdec 100%);
            box-shadow:
                0 -20px 50px rgba(255, 255, 255, 0.7),
                inset 0 10px 25px rgba(255, 255, 255, 0.95);
            animation: driftShift 9s ease-in-out infinite reverse;
        }

        .snowdrift-front::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 60%, rgba(255,255,255,1) 0%, transparent 2%),
                radial-gradient(circle at 42% 45%, rgba(255,255,255,0.9) 0%, transparent 1.8%),
                radial-gradient(circle at 65% 55%, rgba(255,255,255,1) 0%, transparent 2.2%),
                radial-gradient(circle at 82% 40%, rgba(255,255,255,0.85) 0%, transparent 2%);
            animation: sparkleSnow 2.5s ease-in-out infinite;
            pointer-events: none;
            border-radius: inherit;
        }

        /* ======== МОДАЛЬНОЕ ОКНО ======== */
        .wish-modal {
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 16, 0.78);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 20;
            padding: 20px;
        }

        .wish-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .wish-content {
            position: relative;
            background: linear-gradient(145deg, rgba(28, 37, 65, 0.97), rgba(11, 19, 43, 0.97));
            border: 1.5px solid rgba(212, 175, 55, 0.55);
            padding: 45px 35px 35px;
            border-radius: 24px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 60px rgba(212, 175, 55, 0.15);
            transform: scale(0.75) rotate(-2deg);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.4);
        }

        .wish-modal.active .wish-content {
            transform: scale(1) rotate(0deg);
        }

        .wish-content::before,
        .wish-content::after {
            content: '❄';
            position: absolute;
            font-size: 1.4rem;
            color: rgba(212, 175, 55, 0.7);
        }
        .wish-content::before { top: 12px; left: 16px; }
        .wish-content::after  { top: 12px; right: 16px; }

        .wish-text {
            font-family: 'Marck Script', cursive;
            font-size: clamp(1.3rem, 3vw, 1.7rem);
            line-height: 1.5;
            margin-bottom: 28px;
            color: #fff8e7;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        /* ======== КНОПКА ======== */
        .btn {
            position: relative;
            display: inline-block;
            padding: 16px 42px;
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            font-weight: 700;
            font-size: clamp(1rem, 2.2vw, 1.15rem);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #0b132b;
            background: linear-gradient(135deg, #f9e79f 0%, #d4af37 40%, #b8860b 70%, #f3e5ab 100%);
            background-size: 200% 200%;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            overflow: hidden;
            box-shadow:
                0 6px 20px rgba(212, 175, 55, 0.4),
                0 0 0 1px rgba(255, 248, 231, 0.6) inset,
                0 -2px 6px rgba(0, 0, 0, 0.2) inset;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background-position 0.6s ease;
            animation: btnGlow 3s ease-in-out infinite;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.75), transparent);
            transform: skewX(-25deg);
            animation: shine 3.5s ease-in-out infinite;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.03);
            background-position: 100% 50%;
            box-shadow:
                0 10px 30px rgba(212, 175, 55, 0.7),
                0 0 0 1px rgba(255, 248, 231, 0.8) inset,
                0 -2px 6px rgba(0, 0, 0, 0.2) inset,
                0 0 25px rgba(255, 223, 130, 0.7);
        }

        .btn:active { transform: translateY(1px) scale(0.99); }

        .btn span { position: relative; z-index: 2; }

        .btn::after {
            content: '✦';
            position: absolute;
            top: -6px;
            right: 8px;
            font-size: 0.9rem;
            color: #fff8e7;
            animation: sparkle 2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes btnGlow {
            0%, 100% { filter: brightness(1); }
            50%      { filter: brightness(1.12); }
        }

        @keyframes shine {
            0%   { left: -100%; }
            60%  { left: 130%; }
            100% { left: 130%; }
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
            50%      { opacity: 1;   transform: scale(1.3) rotate(90deg); }
        }

        /* Адаптивность */
        @media (max-width: 600px) {
            .container { padding-bottom: 50px; }
            .globe-img { max-height: 50vh; }
            .globe-container { margin-bottom: -45px; } /* на телефоне тоже ниже */
            .title { font-size: clamp(1rem, 3.5vw, 1.4rem); }
            .wish-content { padding: 35px 22px 28px; }
            .btn { padding: 14px 30px; }
            .snowdrifts { height: 200px; }
            .snowdrift.back   { height: 150px; }
            .snowdrift.middle { height: 120px; }
            .snowdrift-front  { height: 115px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .globe-img, .btn { animation: none !important; }
        }
    </style>
</head>
<body>

    <div class="stars" id="stars"></div>
    <div class="snow" id="snow"></div>

    <!-- Задние сугробы -->
    <div class="snowdrifts">
        <div class="snowdrift back"></div>
        <div class="snowdrift middle"></div>
    </div>

    <!-- Передний сугроб — под шаром -->
    <div class="snowdrift-front"></div>

    <div class="container">
        <h1 class="title">Нажмите на шар, чтобы загадать желание</h1>

        <div class="globe-container" id="globeContainer">
            <img src="snowglobe.png" alt="Новогодний шар" class="globe-img" id="globeImg">
        </div>
    </div>

    <div class="wish-modal" id="wishModal">
        <div class="wish-content">
            <div class="wish-text" id="wishText">Текст пожелания</div>
            <button class="btn" id="closeModalBtn"><span>Потряси ещё раз</span></button>
        </div>
    </div>

    <script>
        const wishes = [
            "Желаю, чтобы годовой план сбылся уже в октябре!",
            "Желаю, чтобы сложные задачи решались в один клик!",
            "Желаю, чтобы премия была больше, чем список непрочитанных чатов!",
            "Пусть начальник будет добрым, а зарплата — высокой!",
            "Пусть твой профессионализм ценят по достоинству!",
            "Желаю, чтобы работа приносила не только доход, но и удовольствие!",
            "Желаю, чтобы в чате обсуждали только хорошие новости!",
            "Пусть каждый день на работе начинается с улыбки!",
            "Пусть обеденные перерывы будут вкусными и спокойными!",
            "Желаю, чтобы рабочий день заканчивался вовремя!",
            "Желаю меньше стресса и больше поводов для смеха!",
            "Желаю продуктивности без выгорания!",
            "Пусть баланс между работой и личной жизнью будет идеальным!",
            "Пусть твоя чашка кофе всегда будет полной, а задачи — решаемыми!",
            "Желаю, чтобы принтер никогда не зажёвывал документы в самый нужный момент!",
            "Желаю, чтобы работа была интересной, а зарплата — неприлично высокой!",
            "Пусть обед будет вкусным, а послеобеденный сон — разрешённым!",
            "Желаю, чтобы босс был в духе, клиенты — в восторге, а ты — в отпуске!",
            "Пусть все дороги ведут туда, куда тебе нужно!",
            "Желаю, чтобы в кошельке было так же тепло, как в сердце!",
            "Желаю зарплаты, о которой не смел мечтать!",
            "Пусть все «надо» превращаются в «хочу» и «могу»!",
            "Желаю, чтобы Excel не зависал в самый важный момент!",
            "Пусть все совещания длятся 15 минут и заканчиваются решением!",
            "Желаю, чтобы твои мечты сбывались даже без запросов во Вселенную!",
            "Ваша жизнь станет как новогодняя гирлянда: яркой, длинной и с кучей мигающих идей!",
            "Пусть каждый твой шаг, даже маленький, ведёт к большой цели!",
            "Желаю не ждать идеального момента, а создавать его самому. Новый год — лучший повод сказать себе: «Я могу!»",
            "Желаю, чтобы каждый день ты становился хоть на 1% лучше. За год это 365% — считай, совсем другой человек, только с твоим лицом и твоими мечтами!",
            "Желаю тебе выходить из зоны комфорта так же легко, как выходишь из дома за мандаринами. Волнительно — но вкусно!",
            "Желаю тебе замечать хорошее в мелочах: тёплый кофе, случайная улыбка, любимая песня в наушниках. Счастье — оно из таких вот кирпичиков!",
            "Пусть твой стакан всегда будет наполовину полным. А если нет — налей ещё, у тебя есть право!",
            "Желаю тебе той самой лёгкости: когда проблемы решаются, планы сбываются, а ты идёшь по жизни с улыбкой!",
            "Пусть новый год будет годом твоих побед — больших и маленьких!",
            "Верь в себя так же сильно, как веришь в Деда Мороза в детстве. И даже сильнее!",
            "Ты — главный герой своего года!"
        ];

        const globeContainer = document.getElementById('globeContainer');
        const wishModal = document.getElementById('wishModal');
        const wishText = document.getElementById('wishText');
        const closeModalBtn = document.getElementById('closeModalBtn');

        let lastWishIndex = -1;

        function getRandomWish() {
            let i;
            do { i = Math.floor(Math.random() * wishes.length); }
            while (i === lastWishIndex && wishes.length > 1);
            lastWishIndex = i;
            return wishes[i];
        }

        function showWish() {
            globeContainer.classList.add('shake');
            setTimeout(() => globeContainer.classList.remove('shake'), 600);
            setTimeout(() => {
                wishText.textContent = getRandomWish();
                wishModal.classList.add('active');
            }, 300);
        }

        globeContainer.addEventListener('click', showWish);

        closeModalBtn.addEventListener('click', () => {
            wishModal.classList.remove('active');
            setTimeout(showWish, 400);
        });

        wishModal.addEventListener('click', e => {
            if (e.target === wishModal) wishModal.classList.remove('active');
        });

        // ===== ЗВЁЗДЫ =====
        (function createStars() {
            const starsBox = document.getElementById('stars');
            const total = 220;

            for (let i = 0; i < total; i++) {
                const s = document.createElement('div');
                s.classList.add('star');

                const size = Math.random() * 2 + 1;
                s.style.width = size + 'px';
                s.style.height = size + 'px';
                s.style.left = Math.random() * 100 + 'vw';
                s.style.top = Math.random() * 75 + 'vh';
                s.style.animationDuration = (Math.random() * 3 + 2).toFixed(2) + 's';
                s.style.animationDelay = (Math.random() * 5).toFixed(2) + 's';

                if (size > 2.3) s.classList.add('big');
                if (Math.random() > 0.93) s.classList.add('bright');
                starsBox.appendChild(s);
            }

            [
                { left: '12%', top: '18%' }, { left: '78%', top: '10%' },
                { left: '55%', top: '6%'  }, { left: '30%', top: '30%' },
                { left: '88%', top: '38%' }, { left: '8%',  top: '48%' }
            ].forEach(p => {
                const c = document.createElement('div');
                c.classList.add('star-cross');
                c.style.left = p.left;
                c.style.top = p.top;
                c.style.animationDelay = (Math.random() * 3).toFixed(1) + 's';
                starsBox.appendChild(c);
            });
        })();

        // ===== СНЕГ =====
        (function createSnow() {
            const snowBox = document.getElementById('snow');
            const layers = [
                { count: 130, min: 1,   max: 2.2, minDur: 7, maxDur: 13, cls: 'tiny' },
                { count: 120, min: 2,   max: 3.5, minDur: 5, maxDur: 9,  cls: '' },
                { count: 70,  min: 3.5, max: 5.5, minDur: 4, maxDur: 7,  cls: 'big' },
                { count: 30,  min: 5.5, max: 8,   minDur: 3, maxDur: 6,  cls: 'huge' }
            ];

            layers.forEach(layer => {
                for (let i = 0; i < layer.count; i++) {
                    const f = document.createElement('div');
                    f.classList.add('snowflake');
                    if (layer.cls) f.classList.add(layer.cls);

                    const size = Math.random() * (layer.max - layer.min) + layer.min;
                    f.style.width = size + 'px';
                    f.style.height = size + 'px';
                    f.style.left = Math.random() * 100 + 'vw';
                    f.style.animationDuration = (Math.random() * (layer.maxDur - layer.minDur) + layer.minDur) + 's';
                    f.style.animationDelay = (Math.random() * 12) + 's';
                    f.style.setProperty('--drift', ((Math.random() - 0.5) * 120) + 'px');
                    f.style.opacity = (Math.random() * 0.5 + 0.45).toFixed(2);
                    snowBox.appendChild(f);
                }
            });
        })();
    </script>
</body>
